<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" width="800" height="482" viewBox="0 0 800 482" role="img" aria-labelledby="title description">
<title id="title">Windows OneMouse에 Mac의 6자리 페어링 코드 입력</title>
<desc id="description">앱 소스 기반 화면 예시입니다. Windows 기기 관리에서 다른 방법으로 연결을 펼친 뒤, 같은 Wi-Fi의 Mac 기기 행에 Mac이 표시한 6자리 코드를 입력하고 페어링을 누릅니다. 123456은 예시 번호입니다.</desc>
