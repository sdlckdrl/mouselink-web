<svg xmlns="http://www.w3.org/2000/svg" width="480" height="281" viewBox="0 0 480 281" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">OneMouse Android 앱의 블루투스 모드 시작 버튼 위치 예시</title>
  <desc id="description">OneMouse 앱 설정의 연결 영역을 소스에 맞춰 재현했습니다. 블루투스 연결 모드가 꺼져 있을 때 블루투스 모드 시작 버튼이 표시됩니다.</desc>
  <rect width="480" height="281" rx="18" fill="#eef4ff"/>
  <g font-family="Noto Sans KR,Noto Sans CJK KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif">
    <text x="17" y="27" font-size="15" font-weight="700" fill="#475569">설정</text>
    <rect x="329" y="9" width="134" height="25" rx="12.5" fill="#dbeafe"/>
    <text x="396" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">앱 소스 기반 예시</text>
    <text x="18" y="64" font-size="24" font-weight="700" fill="#0f172a">연결</text>
    <rect x="17" y="77" width="446" height="188" rx="18" fill="#fff" stroke="#dbe6f5"/>
    <text x="35" y="107" font-size="19" font-weight="700" fill="#0f172a">블루투스 연결 모드 (베타)</text>
    <text x="35" y="132" font-size="16" fill="#64748b">꺼짐</text>
    <text x="35" y="155" font-size="15" fill="#64748b">Windows 블루투스 설정에서 이 폰을</text>
    <text x="35" y="176" font-size="15" fill="#64748b">먼저 페어링한 뒤 시작하세요.</text>
    <text x="35" y="202" font-size="16" font-weight="700" fill="#2563eb">연결 가이드 보기 ›</text>
    <rect x="35" y="215" width="410" height="38" rx="13" fill="#eaf1ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="240" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">블루투스 모드 시작</text>
  </g>
</svg>
