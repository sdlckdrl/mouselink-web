  <title id="title">macOS 개인정보 보호 및 보안에서 손쉬운 사용 열기</title>
  <desc id="desc">실제 캡처가 아닌 macOS 화면 예시입니다. 시스템 설정의 개인정보 보호 및 보안에서 손쉬운 사용 항목을 선택합니다.</desc>
