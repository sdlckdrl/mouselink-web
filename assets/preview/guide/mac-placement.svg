<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" lang="ko"><title>Mac이 놓인 방향으로 넘기기</title><rect width="760" height="450" fill="#edf4f6"/><rect x="16" y="16" width="728" height="418" rx="24" fill="#f8fcfb" stroke="#c3d9dd" stroke-width="2"/><g font-family="system-ui, Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="38" y="63" fill="#126357" font-size="21" font-weight="840" text-anchor="start">MAC 연결 · 4</text><text x="38" y="116" fill="#142d42" font-size="35" font-weight="850" text-anchor="start">Mac이 놓인 방향으로 넘기기</text><rect x="38" y="151" width="332" height="176" rx="20" fill="#fff" stroke="#bbd2d9" stroke-width="2"/><circle cx="82" cy="195" r="24" fill="#e5f5ef"/><text x="82" y="203" fill="#045d50" font-size="23" font-weight="850" text-anchor="middle">1</text><text x="120" y="202" fill="#045d50" font-size="22" font-weight="830" text-anchor="start">내 Windows PC</text><text x="61" y="254" fill="#132f45" font-size="24" font-weight="830" text-anchor="start">기기 배치 열기</text><text x="61" y="289" fill="#365b6d" font-size="19" font-weight="630" text-anchor="start">Mac을 실제 방향에 놓기</text><rect x="390" y="151" width="332" height="176" rx="20" fill="#fff" stroke="#bbd2d9" stroke-width="2"/><circle cx="434" cy="195" r="24" fill="#eaf1fd"/><text x="434" y="203" fill="#244c79" font-size="23" font-weight="850" text-anchor="middle">2</text><text x="472" y="202" fill="#244c79" font-size="22" font-weight="830" text-anchor="start">Mac</text><text x="413" y="254" fill="#132f45" font-size="24" font-weight="830" text-anchor="start">커서가 들어오는 쪽</text><text x="413" y="289" fill="#365b6d" font-size="19" font-weight="630" text-anchor="start">Windows 가장자리에서 진입</text><rect x="38" y="349" width="684" height="62" rx="12" fill="#dcefeb"/><path d="M62 378l8 8 13-15" fill="none" stroke="#146a57" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="387" fill="#194b46" font-size="19" font-weight="700" text-anchor="start">예시: Mac이 오른쪽이라면 PC 화면 오른쪽 끝으로 이동</text></g></svg>
