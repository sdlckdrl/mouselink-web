<g transform="translate(385 116)" fill="none" stroke="#3c526f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M7 5V3h6v2M5 5l1 13h8l1-13M8.5 8v7M11.5 8v7"/></g>
<text x="395" y="167" text-anchor="middle" font-size="17" font-weight="600" fill="#394557">Clear cache</text></g>
</svg>
